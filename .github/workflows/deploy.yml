# Build the Hugo site and publish it to GitHub Pages.
#
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
# No tokens or secrets are needed — Pages deploys via the workflow's OIDC token.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Hugo extended; >= 0.146 is required for the theme's layouts/_partials layout.
  HUGO_VERSION: "0.158.0"
  PAGES_CUSTOM_DOMAIN: "norionanalytics.com"

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Hugo
        run: |
          wget -q -O "${RUNNER_TEMP}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"
          hugo version

      - name: Build
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --destination public

      - name: Add Pages metadata
        run: |
          touch public/.nojekyll
          if [ -n "$PAGES_CUSTOM_DOMAIN" ]; then
            echo "$PAGES_CUSTOM_DOMAIN" > public/CNAME
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    # Pull requests get a build check only; publishing happens from main.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
