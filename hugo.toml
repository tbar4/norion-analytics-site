baseURL = "https://norionanalytics.com/"
languageCode = "en-us"
title = "Norion Analytics"
theme = "not-much"
copyright = "© {year} Norion Analytics"

# Drafts and future-dated posts stay out of the production build.
buildDrafts = false
buildFuture = false

enableRobotsTXT = true

[pagination]
  pagerSize = 10

[markup]
  [markup.highlight]
    style = "dracula"
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  # theme: light | dark | auto — see themes/not-much/configuration.md
  theme = "light"
  # palette: catpuccin | default | dracula | eink | solarized
  palette = "default"
  showThemeNotice = false
  showPostsSummary = true
  showFooterEverywhere = true
  description = "Data ontologies for space domain awareness."

# Navigation
[menu]
  [[menu.main]]
    identifier = "home"
    name = "home"
    title = "Home"
    url = "/"
    weight = 1

